# ===============================
# application-dev.properties (Neon環境)
# ===============================

# 1. データベース接続情報 (Neonからコピーした情報を入れる)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dummy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dummy_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dummy_password}
spring.datasource.driver-className=org.postgresql.Driver

# 2. JPA / Hibernate (PostgreSQLの機能を使うよう指示)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 起動時にエンティティから自動でテーブルを作成させる
spring.jpa.hibernate.ddl-auto=update
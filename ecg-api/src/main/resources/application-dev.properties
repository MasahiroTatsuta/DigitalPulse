# ===============================
# application-dev.properties (Local Neon)
# ===============================

# 1. データベース接続情報
# 環境変数が設定されていない場合は、コロン(:)以降のデフォルト値（実際のNeon情報）を使用します
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://[あなたのNeonホスト名]/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
# ⚠️ ここに生のパスワードを書いてプッシュしないよう注意！
# ローカルで動かす時は ${...} の中に書くか、OSの環境変数にセットしてください
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:あなたのパスワード}
spring.datasource.driver-className=org.postgresql.Driver

# 2. JPA / Hibernate (PostgreSQL環境に最適化)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ローカルではSQLログを表示してデバッグしやすくする
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
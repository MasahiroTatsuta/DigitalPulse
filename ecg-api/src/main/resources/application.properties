# --- 基本設定 ---
spring.application.name=ecg-api
server.port=${PORT:10000}

# --- データベース設定 (Neon / PostgreSQL) ---
# Renderの「Environment」で設定した各変数を自動で読み込みます
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-className=org.postgresql.Driver

# --- JPA / Hibernate 設定 ---
# 1. DBの種類を PostgreSQL に変更
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 2. 自動テーブル更新を有効化（Neonへの初動をスムーズにするため）
spring.jpa.hibernate.ddl-auto=update
# 3. メタデータ取得設定（PostgreSQLでも有効）
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# --- AI (Cloud Run) 設定 ---
ai.api.url=https://digitalpulse-ai-577228926445.asia-northeast1.run.app

# --- ログ設定 ---
logging.level.org.hibernate=ERROR
logging.level.root=INFO